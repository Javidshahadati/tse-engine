name: Ablation Test
on:
  push:
    paths:
      - 'scripts/train_ablation.py'
      - '.github/workflows/ablation.yml'
  workflow_dispatch:

jobs:
  ablation:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install deps
        run: pip install -r requirements.txt
      - name: Build features
        run: python -m features.builder
      - name: Run ablation
        run: python scripts/train_ablation.py
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: ablation-output
          path: outputs/ablation_metrics.json
          retention-days: 7
