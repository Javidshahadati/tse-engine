
name: Train 1M & 3M

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'features/builder_multi.py'
      - 'scripts/train_multi_horizon.py'
      - '.github/workflows/train_multi_horizon.yml'
      - 'requirements.txt'

jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Build clean features
        run: python -m features.builder_multi

      - name: Train both horizons
        run: python scripts/train_multi_horizon.py

      - name: Upload multi-horizon results
        uses: actions/upload-artifact@v4
        with:
          name: tse-multi-horizon-results
          path: |
            outputs/multi_horizon/
            models/multi_horizon/
          retention-days: 14
