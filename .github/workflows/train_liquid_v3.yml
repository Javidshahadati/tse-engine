name: Train V3 Liquid
on:
  workflow_dispatch:
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: pip install pandas numpy xgboost scikit-learn scipy pyarrow lightgbm
      - name: Build
        run: python features/builder_v3.py
      - name: Run
        run: python scripts/train_liquid_v3.py
      - name: Upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: liquid_universe_results
          path: javid_v3/liquid_universe_results.json
