
name: TSE OHLC V5.7 Controlled Audit

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check requests

      - name: Run V5.7 controlled audit
        env:
          PYTHONUNBUFFERED: "1"
        run: python -u scripts/audit_ohlc_v5_7.py

      - name: Upload V5.7 audit artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tse-ohlc-v5-7
          path: v5_7_output/
          if-no-files-found: warn
          retention-days: 14
