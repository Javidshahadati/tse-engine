
name: Deep OHLC Audit V4

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run V4 audit
        run: python scripts/audit_ohlc_v4.py

      - name: Upload V4 report
        uses: actions/upload-artifact@v4
        with:
          name: tse-ohlc-deep-audit-v4
          path: v4_output/
          if-no-files-found: error
          retention-days: 14
