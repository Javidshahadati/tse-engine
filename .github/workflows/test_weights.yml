name: Test Weights
on:
  push:
    paths:
      - 'scripts/test_weights.py'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install deps
        run: pip install -r requirements.txt
      - name: Build features
        run: python -m features.builder
      - name: Train (need predictions)
        run: python scripts/train_stack.py
      - name: Test weights
        run: python scripts/test_weights.py
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: weights-result
          path: outputs/weights_comparison.json
          retention-days: 7
