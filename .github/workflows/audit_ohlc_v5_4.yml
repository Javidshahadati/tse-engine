name: TSE OHLC V5.4 Adjusted Label Audit

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: python -m pip install --upgrade pip requests

      - name: Run V5.4 adjusted audit
        run: python scripts/audit_ohlc_v5_4.py

      - name: Upload V5.4 report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tse-ohlc-v5-4
          path: v5_4_output/
          if-no-files-found: warn
