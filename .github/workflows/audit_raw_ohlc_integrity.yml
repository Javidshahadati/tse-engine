
name: Audit Raw OHLC Integrity

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: python -m pip install requests

      - name: Run raw OHLC audit
        run: python scripts/audit_raw_ohlc_integrity.py

      - name: Upload audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tse-raw-ohlc-integrity-audit
          path: outputs/raw_ohlc_audit/
          if-no-files-found: warn
          retention-days: 14
