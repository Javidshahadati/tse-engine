name: Fetch Full Data v2
on:
  workflow_dispatch:
    inputs:
      n_symbols:
        description: '2 for debug, 10 test, all full'
        default: '2'
      sleep_sec:
        default: '2'

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      PYTHONUNBUFFERED: '1'
      N_SYMBOLS: ${{ github.event.inputs.n_symbols }}
      SLEEP_SEC: ${{ github.event.inputs.sleep_sec }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: |
          pip install --upgrade pip
          pip install pytse-client pandas
      - name: Test import only
        run: |
          python -c "import pytse_client; print('IMPORT OK', flush=True)"
      - name: Fetch
        run: python data_fetch/fetch_full_data.py
      - name: Upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ohlc-v2
          path: data_fetch/
          retention-days: 30
      - name: Push branch
        if: always()
        run: |
          git config user.name "TSE Bot"; git config user.email "bot@tse-engine.ai"
          git checkout -B data-full
          git add data_fetch/ || true
          git diff --staged --quiet || git commit -m "fetch v2 $(date -u +%Y-%m-%dT%H:%M)"
          git push -u origin data-full --force || true
