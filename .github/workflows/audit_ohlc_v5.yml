
name: Audit OHLC V5 Raw TSETMC

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests

      - name: Run V5 raw API audit
        run: python scripts/audit_ohlc_v5.py

      - name: Upload V5 report
        uses: actions/upload-artifact@v4
        with:
          name: tse-ohlc-v5-raw-audit
          path: v5_output/
          if-no-files-found: error
          retention-days: 14
