name: Train v2
on:
  workflow_dispatch:
  push:
    branches: [v2]
    paths:
      - "features/builder_v2.py"
      - "features/fundamental_v2.py"
      - "scripts/train_v2.py"

jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          pip install -r requirements.txt
          pip install xgboost lightgbm --upgrade
      - name: Build features
        run: python -m features.builder_v2
      - name: Train
        run: python scripts/train_v2.py
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: v2-outputs
          path: javid_v2/
          retention-days: 30
