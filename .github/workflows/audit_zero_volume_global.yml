name: Audit Zero Volume Global V2

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run global OHLC audit
        run: |
          python scripts/audit_zero_volume_global.py

      - name: Upload audit report
        uses: actions/upload-artifact@v4
        with:
          name: tse-zero-volume-global-audit-v2
          path: zero_volume_audit/
          if-no-files-found: error
          retention-days: 14
