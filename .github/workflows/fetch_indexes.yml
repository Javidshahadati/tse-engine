name: Fetch Indexes
on:
  workflow_dispatch:
jobs:
  f:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions: { contents: write }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - run: pip install requests
      - run: python data_fetch/fetch_indexes.py
      - name: Push
        run: |
          git config user.name "Bot"; git config user.email "bot@tse-engine.ai"
          git add data/indexes_full.json.gz
          git commit -m "data: indexes_full $(date -u +%Y-%m-%d)" || echo "no changes"
          git push
