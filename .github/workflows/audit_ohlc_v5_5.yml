name: TSE OHLC V5.5 Adjustment Validation

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: python -m pip install --upgrade pip requests

      - name: Check Clean V3 file
        run: |
          ls -lh data/ohlc_clean_v3_20d.json.gz
          python - <<'PY'
          import gzip, json
          p = "data/ohlc_clean_v3_20d.json.gz"
          with gzip.open(p, "rt", encoding="utf-8") as f:
              x = json.load(f)
          print("Clean V3 top-level type:", type(x).__name__)
          print("Top-level count:", len(x) if hasattr(x, "__len__") else "NA")
          PY

      - name: Run V5.5 validation
        run: python scripts/audit_ohlc_v5_5.py

      - name: Upload V5.5 report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tse-ohlc-v5-5
          path: v5_5_output/
          if-no-files-found: warn
