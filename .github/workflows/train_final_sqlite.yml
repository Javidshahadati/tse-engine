name: TSE Final SQLite Training

on:
  workflow_dispatch:
    inputs:
      db_release_tag:
        description: "Release containing 83 database parts"
        required: true
        type: string
        default: "final-training-db-20261123"
      threshold:
        description: "Positive net return threshold"
        required: true
        default: "0.017"
        type: string

permissions:
  contents: write

jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout research branch
        uses: actions/checkout@v4
        with:
          ref: research/leakage-safe-pipeline-20261123

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy pandas scikit-learn xgboost==2.1.4

      - name: Download all 83 parts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DB_RELEASE_TAG: ${{ inputs.db_release_tag }}
        run: |
          mkdir -p data/parts
          gh release download "$DB_RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern "db-part-*-of-083.gzpart" \
            --dir data/parts

      - name: Reassemble and validate SQLite
        run: |
          python - <<'PY'
          from pathlib import Path
          import gzip
          import shutil
          import sqlite3

          folder = Path("data/parts")
          names = [
              f"db-part-{i:03d}-of-083.gzpart"
              for i in range(83)
          ]

          missing = [n for n in names if not (folder / n).is_file()]
          if missing:
              raise RuntimeError(f"Missing parts: {missing}")

          sizes = [(folder / n).stat().st_size for n in names]
          chunk_size = 5 * 1024 * 1024

          if any(s != chunk_size for s in sizes[:-1]):
              raise RuntimeError("Invalid size among first 82 parts")

          if not 0 < sizes[-1] <= chunk_size:
              raise RuntimeError("Invalid final part size")

          compressed = Path("data/final_training.sqlite.gz")
          database = Path("data/final_training.sqlite")

          with compressed.open("wb") as out:
              for name in names:
                  with (folder / name).open("rb") as src:
                      shutil.copyfileobj(src, out, 1024 * 1024)

          print("Compressed bytes:", compressed.stat().st_size)

          # Decompressing to EOF also checks gzip CRC.
          with gzip.open(compressed, "rb") as src:
              with database.open("wb") as out:
                  shutil.copyfileobj(src, out, 4 * 1024 * 1024)

          print("SQLite bytes:", database.stat().st_size)

          con = sqlite3.connect(
              f"file:{database}?mode=ro", uri=True
          )

          try:
              check = con.execute(
                  "PRAGMA integrity_check"
              ).fetchone()[0]

              if check != "ok":
                  raise RuntimeError(f"SQLite error: {check}")

              tables = {
                  x[0] for x in con.execute(
                      "SELECT name FROM sqlite_master WHERE type='table'"
                  )
              }

              if "dataset" not in tables:
                  raise RuntimeError("dataset table missing")

              columns = {
                  x[1] for x in con.execute(
                      "PRAGMA table_info(dataset)"
                  )
              }

              required = {
                  "date", "symbol", "features",
                  "target_20", "target_40", "target_60"
              }

              if not required.issubset(columns):
                  raise RuntimeError(
                      f"Missing columns: {required - columns}"
                  )

              rows = con.execute(
                  "SELECT COUNT(*) FROM dataset"
              ).fetchone()[0]

              symbols = con.execute(
                  "SELECT COUNT(DISTINCT symbol) FROM dataset"
              ).fetchone()[0]

              if rows < 100000 or symbols < 500:
                  raise RuntimeError(
                      f"Unexpected size: {rows} rows, {symbols} symbols"
                  )

              print("SQLite integrity_check: OK")
              print("Rows:", rows)
              print("Symbols:", symbols)

          finally:
              con.close()
          PY

      - name: Train H20 H40 H60
        run: |
          python scripts/train_final_sqlite.py \
            --db data/final_training.sqlite \
            --out results \
            --threshold "${{ inputs.threshold }}" \
            --embargo 60

      - name: Verify outputs
        run: |
          test -s results/walk_forward_metrics.csv
          test -s results/summary_metrics.csv
          test -s results/training_metadata.json
          test -s results/xgb_h20.json
          test -s results/xgb_h40.json
          test -s results/xgb_h60.json
          ls -lh results/

      - name: Publish training results
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="training-results-$(date -u +%Y%m%d-%H%M%S)"
          gh release create "$TAG" results/* \
            --repo "$GITHUB_REPOSITORY" \
            --target research/leakage-safe-pipeline-20261123 \
            --title "TSE training results $TAG" \
            --notes "Walk-forward metrics and exploratory H20/H40/H60 models. Corporate-action validation remains outstanding."

      - name: Workflow summary
        if: always()
        run: |
          if [ -f results/summary_metrics.csv ]; then
            echo "## Walk-forward summary" >> "$GITHUB_STEP_SUMMARY"
            cat results/summary_metrics.csv >> "$GITHUB_STEP_SUMMARY"
          fi
