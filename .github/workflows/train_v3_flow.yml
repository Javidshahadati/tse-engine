name: Train V3 Flow
on:
  workflow_dispatch:

jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions: { contents: write }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - run: pip install pandas numpy xgboost scikit-learn scipy pyarrow
      - name: Patch
        run: |
          python scripts/patch_54feat.py
          python scripts/patch_mem.py
      - name: Build
        run: python features/builder_v3.py
      - name: Train 20d
        env: { HORIZON: '20d' }
        run: python scripts/train_v3_unified.py
      - name: Train 60d
        env: { HORIZON: '60d' }
        run: python scripts/train_v3_unified.py
      - name: Commit models
        run: |
          git config user.name "Bot"; git config user.email "bot@tse-engine.ai"
          mkdir -p javid_v3
          git add javid_v3/model_v3_*.json javid_v3/metrics_v3_*.json javid_v3/summary_v3_*.json || true
          git diff --staged --quiet || git commit -m "🤖 models v3 $(date -u +%Y-%m-%d)"
          git push || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v3-models
          path: javid_v3/
          retention-days: 30
