name: Validate V3 20d
on:
  workflow_dispatch:
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: pip install pandas numpy pyarrow lightgbm scipy
      - name: Validate
        run: python scripts/validate_v3_20d.py --data javid_v3/features_v3_20d.parquet --out javid_v3/validation_v3_20d.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: validation_v3_20d
          path: javid_v3/validation_v3_20d.json
