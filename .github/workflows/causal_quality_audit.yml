name: Causal Features Quality Audit

on:
  push:
    branches:
      - research/leakage-safe-pipeline-20261123
    paths:
      - .github/workflows/causal_quality_audit.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout development branch
        uses: actions/checkout@v4
        with:
          ref: research/leakage-safe-pipeline-20261123

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Download existing feature release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p audit_data
          gh release download causal-features-45167997530 \
            --repo Javidshahadati/tse-engine \
            --pattern "features_causal.parquet" \
            --pattern "features_causal_summary.json" \
            --dir audit_data

      - name: Audit Parquet without modifying it
        run: |
          python -m pip install --quiet duckdb
          python - <<'PY'
          import duckdb, json, pathlib, os

          p = pathlib.Path("audit_data/features_causal.parquet")
          summary_path = pathlib.Path("audit_data/features_causal_summary.json")
          con = duckdb.connect()
          fp = "'" + str(p.resolve()).replace("'", "''") + "'"

          schema = con.execute(
              f"DESCRIBE SELECT * FROM read_parquet({fp})"
          ).fetchall()
          columns = [{"name": r[0], "type": r[1]} for r in schema]
          names = [c["name"] for c in columns]
          quote = lambda x: '"' + x.replace('"', '""') + '"'

          base = con.execute(f"""
              SELECT COUNT(*), COUNT(DISTINCT symbol),
                     MIN(date), MAX(date),
                     COUNT(*) - COUNT(DISTINCT (symbol, date))
              FROM read_parquet({fp})
          """).fetchone()

          numeric = [
              c for c in columns
              if any(t in c["type"].upper()
                     for t in ("INT", "UINT", "FLOAT", "DOUBLE", "DECIMAL"))
          ]

          expr = []
          for c in numeric:
              n = quote(c["name"])
              expr.extend([
                  f"COUNT(*) FILTER (WHERE {n} IS NULL)",
                  f"COUNT(*) FILTER (WHERE isnan(TRY_CAST({n} AS DOUBLE)))",
                  f"COUNT(*) FILTER (WHERE isinf(TRY_CAST({n} AS DOUBLE)))"
              ])

          vals = con.execute(
              f"SELECT {', '.join(expr)} FROM read_parquet({fp})"
          ).fetchone() if expr else ()

          excluded = {
              "symbol", "date", "open", "high", "low", "close", "volume",
              "ohl_geometry_valid", "close_in_trade_range"
          }
          features = [n for n in names if n not in excluded]

          symbol_stats = con.execute(f"""
              SELECT COUNT(*), MIN(n), MAX(n)
              FROM (
                  SELECT symbol, COUNT(*) n
                  FROM read_parquet({fp})
                  GROUP BY symbol
              )
          """).fetchone()

          flags = {}
          for flag in ("ohl_geometry_valid", "close_in_trade_range"):
              if flag in names:
                  flags[flag] = con.execute(
                      f"SELECT COUNT(*) FILTER (WHERE NOT {quote(flag)}) "
                      f"FROM read_parquet({fp})"
                  ).fetchone()[0]

          missing = {}
          for i, c in enumerate(numeric):
              nulls, nans, infs = vals[i*3:i*3+3]
              missing[c["name"]] = {
                  "null": nulls, "nan": nans, "inf": infs
              }

          report = {
              "rows": base[0],
              "symbols": base[1],
              "date_min": str(base[2]),
              "date_max": str(base[3]),
              "duplicate_symbol_dates": base[4],
              "total_columns": len(columns),
              "feature_count": len(features),
              "feature_names": features,
              "numeric_columns": len(numeric),
              "missing_nonfinite_by_column": missing,
              "per_symbol": {
                  "symbols": symbol_stats[0],
                  "min_rows": symbol_stats[1],
                  "max_rows": symbol_stats[2]
              },
              "quality_flag_false_counts": flags
          }

          if summary_path.exists():
              try:
                  report["builder_summary"] = json.loads(
                      summary_path.read_text(encoding="utf-8")
                  )
              except Exception as e:
                  report["summary_read_error"] = str(e)

          pathlib.Path("quality_audit.json").write_text(
              json.dumps(report, ensure_ascii=False, indent=2, default=str),
              encoding="utf-8"
          )

          print(json.dumps(report, ensure_ascii=False, indent=2, default=str))

          with open(os.environ["GITHUB_STEP_SUMMARY"], "a",
                    encoding="utf-8") as f:
              f.write("# Causal features quality audit\n\n")
              f.write(f"- Rows: **{base[0]:,}**\n")
              f.write(f"- Symbols: **{base[1]}**\n")
              f.write(f"- Dates: **{base[2]} – {base[3]}**\n")
              f.write(f"- Duplicate symbol/date rows: **{base[4]:,}**\n")
              f.write(f"- Total columns: **{len(columns)}**\n")
              f.write(f"- Engineered features: **{len(features)}**\n")
              f.write(f"- Rows per symbol: **{symbol_stats[1]}–{symbol_stats[2]}**\n\n")
              f.write("| Numeric column | Null | NaN | Inf |\n")
              f.write("|---|---:|---:|---:|\n")
              for name, m in missing.items():
                  if m["null"] or m["nan"] or m["inf"]:
                      f.write(
                          f"| {name} | {m['null']} | {m['nan']} | {m['inf']} |\n"
                      )
              f.write("\n## Quality flags\n")
              for name, count in flags.items():
                  f.write(f"- {name} false: **{count:,}**\n")
              f.write("\nFull report is printed in the job log.\n")
          PY
