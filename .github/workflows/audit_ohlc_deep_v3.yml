name: Deep OHLC Quality Audit V3

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run deep OHLC audit
        run: |
          python scripts/audit_ohlc_deep_v3.py

      - name: Upload audit report
        uses: actions/upload-artifact@v4
        with:
          name: tse-ohlc-deep-audit-v3
          path: ohlc_deep_audit/
          if-no-files-found: error
          retention-days: 14
