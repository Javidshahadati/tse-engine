name: TSE causal exploratory model training

on:
  push:
    branches:
      - research/leakage-safe-pipeline-20261123
    paths:
      - "scripts/train_walk_forward_causal.py"
      - ".github/workflows/causal_exploratory_training.yml"

permissions:
  contents: write

concurrency:
  group: tse-causal-exploratory-training
  cancel-in-progress: false

jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout development branch
        uses: actions/checkout@v4
        with:
          ref: research/leakage-safe-pipeline-20261123

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Download verified full-market features
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p outputs
          gh release download causal-features-45167997530 \
            --repo Javidshahadati/tse-engine \
            --pattern features_causal.parquet \
            --dir outputs
          test -s outputs/features_causal.parquet

      - name: Train exploratory 5-session model
        run: |
          python scripts/train_walk_forward_causal.py \
            --input outputs/features_causal.parquet \
            --horizon 5 \
            --label-threshold 0.017 \
            --round-trip-cost 0.0 \
            --signal-threshold 0.60 \
            --folds 4 \
            --output-dir outputs/causal_walk_forward_h5_cost0

      - name: Publish metrics and fold models
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="causal-training-${GITHUB_RUN_ID}"
          gh release create "$TAG" \
            outputs/causal_walk_forward_h5_cost0/metrics.json \
            outputs/causal_walk_forward_h5_cost0/models/*.json \
            --repo Javidshahadati/tse-engine \
            --target research/leakage-safe-pipeline-20261123 \
            --title "Exploratory causal model training ${GITHUB_RUN_ID}" \
            --notes "Five-session exploratory Walk-Forward baseline. Zero transaction cost is diagnostic only, not a trading-cost assumption. Adjusted-price point-in-time safety is unverified. Not production-ready." \
            --prerelease
