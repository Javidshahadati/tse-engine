name: Analyze V3 20d B
on:
  workflow_dispatch:
jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: pip install pandas numpy xgboost scikit-learn scipy pyarrow lightgbm
      - name: Build
        run: python features/builder_v3.py
      - name: Analyze full model
        run: python scripts/analyze_v3_20d_b.py
      - name: Analyze no fundamentals
        run: NOFUND=1 python scripts/analyze_v3_20d_b.py
      - name: Upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: analysis_v3_20d_b
          path: |
            javid_v3/analysis_v3_20d_fixed.json
            javid_v3/analysis_v3_20d_nofund.json
            javid_v3/survivorship_v3.json
