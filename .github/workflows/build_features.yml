name: Build & Train
on:
  push:
    paths:
      - 'features/**'
      - 'scripts/**'
      - 'requirements.txt'
      - 'data/fundamentals.json'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install deps
        run: pip install -r requirements.txt
      - name: Build features
        run: python -m features.builder
      - name: Train
        run: python scripts/train_stack.py
      - name: Backtest
        run: python scripts/backtest_stack.py
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: step14-outputs
          path: |
            outputs/
            models/
          retention-days: 7
