name: Build Features
on:
  push:
    paths:
      - 'features/**'
      - 'requirements.txt'
      - '.github/workflows/build_features.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install deps
        run: pip install -r requirements.txt
      - name: Run builder
        run: python -m features.builder
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: features-output
          path: outputs/
          retention-days: 7
