name: Diagnostic (realistic backtest)
on:
  push:
    paths:
      - 'scripts/backtest_diag.py'
      - '.github/workflows/diag.yml'
  workflow_dispatch:

jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install deps
        run: pip install -r requirements.txt
      - name: Build features
        run: python -m features.builder
      - name: Realistic backtest
        run: python scripts/backtest_diag.py
      - name: Upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backtest-result
          path: outputs/backtest_diag.json
          if-no-files-found: warn
          retention-days: 7
