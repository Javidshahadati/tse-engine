name: Diagnostic (64 safe features)
on:
  push:
    paths:
      - 'scripts/train_diag.py'
      - 'scripts/backtest_diag.py'
      - '.github/workflows/diag.yml'
  workflow_dispatch:

jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install deps
        run: pip install -r requirements.txt
      - name: Build features
        run: python -m features.builder
      - name: Train diag
        run: python scripts/train_diag.py
      - name: Backtest diag (per-fold)
        run: python scripts/backtest_diag.py
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: diag-output
          path: |
            outputs/metrics_diag.json
            outputs/backtest_diag.json
          retention-days: 7
