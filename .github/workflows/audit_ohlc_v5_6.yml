
name: TSE OHLC V5.6 Full Universe Audit

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: python -m pip install requests

      - name: Run V5.6.1 access probe and audit
        env:
          PYTHONUNBUFFERED: "1"
        run: python -u scripts/audit_ohlc_v5_6.py

      - name: Upload V5.6.1 artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tse-ohlc-v5-6
          path: v5_6_output/
          if-no-files-found: warn
          retention-days: 14
