name: Audit OHLC V5.2

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run V5.2 raw API audit
        run: python scripts/audit_ohlc_v5_2.py

      - name: Upload V5.2 report
        uses: actions/upload-artifact@v4
        with:
          name: tse-ohlc-v5-2-audit
          path: v5_2_output/
          if-no-files-found: error
          retention-days: 14
