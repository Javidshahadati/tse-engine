name: Audit OHLC V5.2

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install requests

      - name: Verify dependency
        run: python -c "import requests; print('requests:', requests.__version__)"

      - name: Run V5.2 raw API audit
        run: python scripts/audit_ohlc_v5_2.py

      - name: Upload V5.2 report
        uses: actions/upload-artifact@v4
        with:
          name: tse-ohlc-v5-2-audit
          path: v5_2_output/
          if-no-files-found: error
          retention-days: 14
