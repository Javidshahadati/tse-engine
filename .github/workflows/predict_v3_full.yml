name: Predict V3 Full
on:
  workflow_dispatch:
  schedule:
    - cron: '30 13 * * *'

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions: { contents: write }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - run: pip install pandas numpy xgboost scikit-learn scipy pyarrow
      - name: Build
        run: python features/builder_v3.py
      - name: Train 20d + Predict
        env: { HORIZON: '20d' }
        run: python scripts/train_v3_unified.py
      - name: Train 60d
        env: { HORIZON: '60d' }
        run: python scripts/train_v3_unified.py
      - name: Commit predictions
        run: |
          git config user.name "Bot"; git config user.email "bot@tse-engine.ai"
          git add public/data/predictions_v3.json -f
          git diff --staged --quiet || git commit -m "predictions $(date -u +%Y-%m-%d)"
          git push || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: predictions
          path: public/data/predictions_v3.json
          retention-days: 30
