name: Final V3
on:
  workflow_dispatch:

jobs:
  final:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: pip install pandas numpy xgboost scikit-learn scipy pyarrow
      - name: Build
        run: python features/builder_v3.py
      - name: Final
        run: python scripts/final_v3.py
      - name: Upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v3-final
          path: javid_v3/final_v3.json
          retention-days: 30
