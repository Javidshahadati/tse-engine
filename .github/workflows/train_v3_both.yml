name: Train V3 Both
on:
  workflow_dispatch:

jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: pip install pandas numpy xgboost scikit-learn scipy pyarrow
      - name: Build
        run: python features/builder_v3.py
      - name: Train 20d
        env: { HORIZON: '20d' }
        run: python scripts/train_v3_unified.py
      - name: Train 60d
        env: { HORIZON: '60d' }
        run: python scripts/train_v3_unified.py
      - name: Upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v3-both
          path: javid_v3/
          retention-days: 30
