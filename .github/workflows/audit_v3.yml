
name: TSE V3 Data Audit

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run audit
        run: python scripts/audit_v3_data.py

      - name: Upload report
        uses: actions/upload-artifact@v4
        with:
          name: tse-v3-audit-report
          path: audit_v3_report.txt
          if-no-files-found: error
