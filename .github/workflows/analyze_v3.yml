name: Analyze V3 20d
on:
  workflow_dispatch:
jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: pip install pandas numpy xgboost scikit-learn scipy pyarrow lightgbm
      - name: Build
        run: python features/builder_v3.py
      - name: Analyze
        run: python scripts/analyze_v3_20d.py
      - name: Upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: analysis_v3_20d
          path: javid_v3/analysis_v3_20d.json
