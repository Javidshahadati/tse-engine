name: Daily Predictions V3
on:
  workflow_dispatch:
  schedule:
    - cron: '30 13 * * *'

jobs:
  predict:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions: { contents: write }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - run: pip install pandas numpy xgboost scikit-learn scipy pyarrow
      - name: Build
        run: python features/builder_v3.py
      - name: Predict
        run: python scripts/predict_v3.py
      - name: Commit
        run: |
          git config user.name "Bot"; git config user.email "bot@tse-engine.ai"
          git add public/data/predictions_v3.json
          git diff --staged --quiet || git commit -m "🤖 predictions $(date -u +%Y-%m-%d)"
          git push || true
