name: Grid Search Backtest
on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/grid_search.py'

jobs:
  grid:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install deps
        run: pip install pandas numpy
      - name: Run grid search
        run: python scripts/grid_search.py
      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: grid-results
          path: grid_results/
          retention-days: 30
