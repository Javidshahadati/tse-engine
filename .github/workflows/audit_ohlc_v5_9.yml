
name: TSE OHLC V5.9 Multi Event Forensic Audit

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: python -m pip install --upgrade pip requests

      - name: Prepare input
        run: mkdir -p data

      - name: Run V5.9 forensic audit
        run: python -u scripts/audit_ohlc_v5_9.py

      - name: Upload V5.9 report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tse-ohlc-v5-9
          path: v5_9_output/
          if-no-files-found: warn
          retention-days: 90
