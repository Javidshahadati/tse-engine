name: Audit Predictions

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: "Training run ID"
        required: true
        default: "44412100686"

permissions:
  actions: read
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest

    steps:
      - name: Download training artifact
        uses: actions/download-artifact@v4
        with:
          name: tse-multi-horizon-results
          path: artifacts
          run-id: ${{ inputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install dependencies
        run: pip install pandas pyarrow numpy

      - name: Analyze predictions
        shell: bash
        run: |
          python - <<'PY'
          import pandas as pd
          import numpy as np
          import os

          print("=" * 55)
          print("TSE ENGINE - PREDICTION AUDIT")
          print("=" * 55)

          base = "artifacts/outputs/multi_horizon"

          def find_col(df, names):
              for n in names:
                  if n in df.columns:
                      return n
              return None

          for horizon in ["1m", "3m"]:
              path = f"{base}/{horizon}/predictions.parquet"

              print("\\n" + "=" * 50)
              print("HORIZON:", horizon.upper())

              if not os.path.exists(path):
                  print("ERROR: prediction file not found")
                  continue

              df = pd.read_parquet(path)
              print("Rows:", len(df))
              print("Columns:", list(df.columns))

              fold = find_col(df, ["fold", "Fold"])
              pred = find_col(df, [
                  "prediction", "pred", "probability",
                  "proba", "score", "avg_pred",
                  "pred_avg", "ensemble_pred"
              ])
              ret = find_col(df, [
                  "future_return", "future_ret",
                  "forward_return", "actual_return",
                  "target_return", "ret", "fwd_return"
              ])
              label = find_col(df, ["label", "target", "y_true"])

              print("Detected columns:")
              print("fold =", fold)
              print("prediction =", pred)
              print("return =", ret)
              print("label =", label)

              groups = (
                  list(df.groupby(fold))
                  if fold else [("ALL", df)]
              )

              for fid, g in groups:
                  print("\\n--- FOLD", fid, "---")
                  print("Rows:", len(g))

                  if pred:
                      p = pd.to_numeric(
                          g[pred], errors="coerce"
                      ).dropna()

                      if len(p):
                          print("Prediction mean:", round(p.mean(), 5))
                          print("Prediction median:", round(p.median(), 5))
                          print("Prediction min/max:",
                                round(p.min(), 5), round(p.max(), 5))

                  if ret:
                      r = pd.to_numeric(
                          g[ret], errors="coerce"
                      ).dropna()

                      if len(r):
                          print("Return mean:", round(r.mean(), 5))
                          print("Return median:", round(r.median(), 5))
                          print("Positive return %:",
                                round((r > 0).mean()*100, 2))
                          print("Best return:", round(r.max(), 5))
                          print("Worst return:", round(r.min(), 5))

                  if label:
                      y = pd.to_numeric(
                          g[label], errors="coerce"
                      ).dropna()

                      if len(y):
                          print("Positive label %:",
                                round(y.mean()*100, 2))

                  if pred and ret:
                      tmp = g[[pred, ret]].copy()
                      tmp[pred] = pd.to_numeric(
                          tmp[pred], errors="coerce"
                      )
                      tmp[ret] = pd.to_numeric(
                          tmp[ret], errors="coerce"
                      )
                      tmp = tmp.dropna()

                      if len(tmp):
                          cutoff = tmp[pred].quantile(0.90)
                          top = tmp[tmp[pred] >= cutoff]

                          print("Top 10% selected:", len(top))
                          print("Top 10% mean return:",
                                round(top[ret].mean(), 5))
                          print("Top 10% positive %:",
                                round((top[ret] > 0).mean()*100, 2))

              print("\\nCompleted:", horizon)

          print("\\nAUDIT FINISHED")
          PY
