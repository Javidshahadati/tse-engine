name: Test A_baseline
on:
  push:
    paths:
      - 'scripts/test_a64.py'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install deps
        run: pip install -r requirements.txt
      - name: Build features
        run: python -m features.builder
      - name: Test A_baseline
        run: python scripts/test_a64.py
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: a64-result
          path: outputs/backtest_metrics_a64.json
          retention-days: 7
