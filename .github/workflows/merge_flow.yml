name: Merge Flow Full
on:
  workflow_dispatch:

jobs:
  merge:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests
      - name: Download + merge
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/merge_flow_all.py
      - name: Push
        run: |
          git config user.name "Bot"
          git config user.email "bot@tse-engine.ai"
          git add data/flow_full.json.gz
          git commit -m "data: flow_full merged $(date -u +%Y-%m-%d)" || echo "no changes"
          git push
