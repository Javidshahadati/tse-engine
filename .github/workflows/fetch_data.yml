name: Fetch Full Data
on:
  workflow_dispatch:
    inputs:
      n_symbols:
        description: 'Number of symbols ("10" test, "all" full)'
        required: true
        default: '10'
      sleep_sec:
        description: 'Sleep between requests (seconds)'
        required: true
        default: '1.5'

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    permissions:
      contents: write
    env:
      N_SYMBOLS: ${{ github.event.inputs.n_symbols }}
      SLEEP_SEC: ${{ github.event.inputs.sleep_sec }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install deps
        run: |
          pip install --upgrade pip
          pip install pytse-client pandas
      - name: Fetch data
        run: python data_fetch/fetch_full_data.py
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ohlc-adjusted
          path: data_fetch/
          retention-days: 30
      - name: Push to data-full branch
        run: |
          git config user.name "TSE Bot"
          git config user.email "bot@tse-engine.ai"
          git checkout -B data-full
          git add data_fetch/
          if ! git diff --staged --quiet; then
            git commit -m "data: fetch $(date -u +%Y-%m-%dT%H:%M)"
            git push -u origin data-full --force
          else
            echo "No changes"
          fi
