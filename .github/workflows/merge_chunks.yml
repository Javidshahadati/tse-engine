name: Merge Chunks
on:
  workflow_dispatch:

jobs:
  merge:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Checkout data-full
        run: |
          git fetch origin data-full
          git checkout data-full
          ls -lh data_fetch/ | head -20
      - name: Merge
        run: python data_fetch/merge_chunks.py
      - name: Upload final
        uses: actions/upload-artifact@v4
        with:
          name: ohlc-full-final
          path: data_fetch/ohlc_full*
          retention-days: 90
      - name: Commit
        run: |
          git config user.name "TSE Bot"; git config user.email "bot@tse-engine.ai"
          git add data_fetch/ohlc_full*
          git commit -m "merge: ohlc_full $(date -u +%Y-%m-%dT%H:%M)" || echo "no changes"
          git push origin data-full
