name: Generate Signals

on:
  push:
    paths:
      - 'scripts/generate_signals.py'
      - 'features/**'
      - 'requirements.txt'
  workflow_dispatch:
  schedule:
    # هر شب ساعت 20:00 به وقت تهران (16:30 UTC) — بعد از بستن بازار
    - cron: '30 16 * * *'

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install deps
        run: pip install -r requirements.txt
      - name: Build features
        run: python -m features.builder
      - name: Generate signals
        run: python scripts/generate_signals.py
      - name: Commit signals
        run: |
          git config user.name "TSE.Engine Bot"
          git config user.email "bot@tse-engine.ai"
          git add public/data/predictions_today.json models/
          git diff --staged --quiet || git commit -m "🤖 Signals $(date -u +%Y-%m-%d)"
          git push
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: daily-signals
          path: public/data/predictions_today.json
          retention-days: 7
