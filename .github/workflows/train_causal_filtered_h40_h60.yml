name: TSE filtered H40 H60 research training

on:
  push:
    branches:
      - research/leakage-safe-pipeline-20261123
    paths:
      - .github/workflows/train_causal_filtered_h40_h60.yml
      - scripts/train_walk_forward_causal_filtered.py
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tse-filtered-h40-h60
  cancel-in-progress: false

jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      NUMEXPR_NUM_THREADS: "1"
    steps:
      - name: Checkout research branch
        uses: actions/checkout@v4
        with:
          ref: research/leakage-safe-pipeline-20261123

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install training dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy==1.26.4 pandas==3.0.3 scikit-learn==1.5.2 joblib==1.4.2 pyarrow==18.1.0 xgboost==2.1.4 lightgbm==4.5.0 catboost==1.2.8 gdown==5.2.0

      - name: Download compact 585-symbol dataset from Google Drive
        run: |
          gdown --fuzzy "https://drive.google.com/file/d/1oXFScLBUC3dDLzr2iQbqRA5wv_pIhENT/view?usp=drivesdk" -O /tmp/features_causal_585_walkforward_compact.pkl
          test -s /tmp/features_causal_585_walkforward_compact.pkl
          ls -lh /tmp/features_causal_585_walkforward_compact.pkl

      - name: Validate dataset and run H40 + H60
        run: |
          mkdir -p run_outputs
          python scripts/train_walk_forward_causal_filtered.py \
            --input /tmp/features_causal_585_walkforward_compact.pkl \
            --horizons 40 60 \
            --folds 2 \
            --threads 1 \
            --seed 42 \
            --label-threshold 0.017 \
            --signal-threshold 0.60 \
            --output-dir run_outputs

      - name: Print final metrics
        if: always()
        run: |
          if [ -f run_outputs/metrics_all_horizons.json ]; then
            cat run_outputs/metrics_all_horizons.json
          else
            echo "Combined metrics file was not created. Check earlier step logs."
          fi

      - name: Save OOF predictions, fold models, and metrics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tse-causal-h40-h60-research-${{ github.run_number }}
          path: run_outputs/
          if-no-files-found: ignore
          compression-level: 1
          retention-days: 7
