name: Analyze JavidLM Audit

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install
        run: pip install pandas pyarrow

      - name: Analyze all trades and equity
        run: |
          python - <<'PY'
          import pandas as pd
          import numpy as np
          import os

          base = "audit_upload"

          datasets = {
              "OUTPUTS_1": (
                  f"{base}/outputs-1/trades.parquet",
                  f"{base}/outputs-1/equity_curve.parquet"
              ),
              "OUTPUTS_2": (
                  f"{base}/outputs-2/trades.parquet",
                  f"{base}/outputs-2/equity_curve.parquet"
              )
          }

          for name, paths in datasets.items():
              print("\\n" + "=" * 65)
              print(name)
              print("=" * 65)

              trades = pd.read_parquet(paths[0])
              equity = pd.read_parquet(paths[1])

              trades["entry_date"] = pd.to_datetime(
                  trades["entry_date"].astype(str),
                  format="%Y%m%d"
              )
              trades["exit_date"] = pd.to_datetime(
                  trades["exit_date"].astype(str),
                  format="%Y%m%d"
              )

              trades["net_ret"] = pd.to_numeric(trades["net_ret"])
              trades["gross_ret"] = pd.to_numeric(trades["gross_ret"])
              trades["pnl"] = pd.to_numeric(trades["pnl"])
              trades["size"] = pd.to_numeric(trades["size"])

              equity["equity"] = pd.to_numeric(equity["equity"])
              equity["daily_ret"] = pd.to_numeric(equity["daily_ret"])
              equity["drawdown"] = pd.to_numeric(equity["drawdown"])

              wins = trades[trades.net_ret > 0]
              losses = trades[trades.net_ret < 0]

              print("TRADES:", len(trades))
              print("UNIQUE SYMBOLS:", trades.symbol.nunique())
              print("ENTRY DATE:", trades.entry_date.min(), "to", trades.entry_date.max())
              print("EXIT DATE:", trades.exit_date.min(), "to", trades.exit_date.max())

              print("\\nTRADE PERFORMANCE")
              print("Win rate %:", round(100 * len(wins) / len(trades), 3))
              print("Mean net return %:", round(100 * trades.net_ret.mean(), 3))
              print("Median net return %:", round(100 * trades.net_ret.median(), 3))
              print("Mean gross return %:", round(100 * trades.gross_ret.mean(), 3))
              print("Mean winning return %:", round(100 * wins.net_ret.mean(), 3) if len(wins) else None)
              print("Mean losing return %:", round(100 * losses.net_ret.mean(), 3) if len(losses) else None)
              print("Profit factor:", round(wins.pnl.sum() / abs(losses.pnl.sum()), 4) if len(losses) and losses.pnl.sum() != 0 else None)

              print("\\nPNL AND POSITION CHECK")
              print("Sum trade PNL:", round(trades.pnl.sum(), 2))
              print("Average position size:", round(trades["size"].mean(), 2))
              print("Min / max position size:", trades["size"].min(), trades["size"].max())
              print("Max simultaneous trades:",
                    max(
                        ((
                            (trades.entry_date <= d) &
                            (trades.exit_date >= d)
                        ).sum()
                        for d in pd.date_range(
                            trades.entry_date.min(),
                            trades.exit_date.max()
                        )),
                        default=0
                    ))

              holding = (trades.exit_date - trades.entry_date).dt.days
              print("Holding days median / mean:", round(holding.median(), 2), round(holding.mean(), 2))

              # Check whether PNL matches size multiplied by net return
              pnl_error = trades.pnl - trades.size * trades.net_ret
              print("Max PNL formula error:", round(pnl_error.abs().max(), 6))

              print("\\nEQUITY PERFORMANCE")
              first = equity.equity.iloc[0]
              last = equity.equity.iloc[-1]
              print("Equity rows:", len(equity))
              print("Initial equity:", round(first, 2))
              print("Final equity:", round(last, 2))
              print("Equity total return %:", round((last / first - 1) * 100, 3))
              print("Max drawdown column %:", round(equity.drawdown.min() * 100, 3))
              print("Worst daily return %:", round(equity.daily_ret.min() * 100, 3))
              print("Best daily return %:", round(equity.daily_ret.max() * 100, 3))
              print("Mean daily return %:", round(equity.daily_ret.mean() * 100, 4))

              print("Sum PNL vs equity change:",
                    round(trades.pnl.sum() - (last - first), 2))

              print("\\nEQUITY LAST 5 ROWS")
              print(equity.tail(5).to_string(index=False))

              print("\\nTRADE RETURN QUANTILES (%)")
              print((trades.net_ret.quantile(
                  [0, .1, .25, .5, .75, .9, 1]
              ) * 100).round(3).to_string())

          print("\\nANALYSIS FINISHED")
          PY
