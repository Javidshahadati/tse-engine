name: Train V3 20d
on:
  workflow_dispatch:

jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: pip install pandas numpy xgboost scikit-learn scipy pyarrow
      - name: Build
        run: python features/builder_v3.py
      - name: Train
        run: python scripts/train_v3_20d.py
      - name: Upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v3-20d
          path: javid_v3/
          retention-days: 30
