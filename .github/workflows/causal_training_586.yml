name: TSE multi-model causal training 586

on:
  push:
    branches:
      - research/leakage-safe-pipeline-20261123
    paths:
      - ".github/workflows/causal_training_586.yml"
      - "scripts/train_walk_forward_causal.py"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: tse-causal-training-586
  cancel-in-progress: false

jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout development branch
        uses: actions/checkout@v4
        with:
          ref: research/leakage-safe-pipeline-20261123

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "numpy==2.2.6"
          pip install "pandas==3.0.0" "pyarrow==19.0.1"
          pip install "scikit-learn==1.5.2"
          pip install "xgboost==2.1.4" "lightgbm==4.6.0" "catboost==1.2.8"
          pip install "joblib>=1.4,<2"

      - name: Download dataset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p inputs
          gh release download causal-dataset-586-v1 \
            --repo Javidshahadati/tse-engine \
            --pattern features_causal_586.pkl \
            --dir inputs
          test "$(stat -c %s inputs/features_causal_586.pkl)" = "693590177"

      - name: Diagnose pickle compatibility
        run: |
          python - <<'PY'
          import pandas as pd
          import pickle
          import pickletools
          from pathlib import Path
          p = Path("inputs/features_causal_586.pkl")
          print("Pandas:", pd.__version__)
          assert pd.__version__ == "3.0.0", f"Unexpected pandas version: {pd.__version__}"
          print("Pickle protocol:", p.open("rb").read(2))
          try:
              df = pd.read_pickle(p)
              print("PICKLE LOAD: PASS", df.shape)
          except Exception as e:
              print("PICKLE LOAD: FAIL", repr(e))
              raise
          PY

      - name: Train H20 H40 H60
        env:
          OMP_NUM_THREADS: "2"
          OPENBLAS_NUM_THREADS: "2"
          MKL_NUM_THREADS: "2"
        run: |
          python scripts/train_walk_forward_causal.py \
            --input inputs/features_causal_586.pkl \
            --horizons 20 40 60 \
            --label-threshold 0.017 \
            --signal-threshold 0.60 \
            --folds 4 \
            --threads 2 \
            --output-dir outputs/causal_walk_forward

          test -s outputs/causal_walk_forward/metrics_all_horizons.json
          for H in 20 40 60; do
            test -s "outputs/causal_walk_forward/H${H}/metrics.json"
            test -s "outputs/causal_walk_forward/H${H}/oof_ensemble_equal_weight.parquet"
          done

      - name: Publish reports and models
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="causal-training-586-${GITHUB_RUN_ID}"
          find outputs/causal_walk_forward -type f -print
          gh release create "$TAG" \
            outputs/causal_walk_forward/metrics_all_horizons.json \
            outputs/causal_walk_forward/H20/metrics.json \
            outputs/causal_walk_forward/H20/oof_ensemble_equal_weight.parquet \
            outputs/causal_walk_forward/H20/models/*/* \
            outputs/causal_walk_forward/H40/metrics.json \
            outputs/causal_walk_forward/H40/oof_ensemble_equal_weight.parquet \
            outputs/causal_walk_forward/H40/models/*/* \
            outputs/causal_walk_forward/H60/metrics.json \
            outputs/causal_walk_forward/H60/oof_ensemble_equal_weight.parquet \
            outputs/causal_walk_forward/H60/models/*/* \
            --repo Javidshahadati/tse-engine \
            --target research/leakage-safe-pipeline-20261123 \
            --title "TSE multi-model research ${GITHUB_RUN_ID}" \
            --notes "H20/H40/H60 purged walk-forward research; no production model claim." \
            --prerelease
