name: TSE causal training - verified 586 symbols

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: tse-causal-training-586
  cancel-in-progress: false

jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout development branch
        uses: actions/checkout@v4
        with:
          ref: research/leakage-safe-pipeline-20261123

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "numpy>=1.24,<2.1"
          pip install "pandas>=2.0,<2.3"
          pip install "xgboost==2.0.3"
          pip install "scikit-learn>=1.3,<1.6"

      - name: Download verified dataset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p inputs
          gh release download causal-dataset-586-v1 \
            --repo Javidshahadati/tse-engine \
            --pattern features_causal_586.pkl \
            --dir inputs
          test -s inputs/features_causal_586.pkl
          stat -c "Dataset bytes: %s" inputs/features_causal_586.pkl

      - name: Validate dataset
        run: |
          python - <<'PY'
          import pandas as pd
          from pathlib import Path

          p = Path("inputs/features_causal_586.pkl")

          if p.stat().st_size != 693590177:
              raise SystemExit("Dataset file size mismatch")

          df = pd.read_pickle(p)

          if len(df) != 1472718:
              raise SystemExit("Wrong row count")

          if df["symbol"].nunique() != 586:
              raise SystemExit("Wrong symbol universe")

          if df.duplicated(["symbol", "date"]).any():
              raise SystemExit("Duplicate symbol/date rows")

          expected = {
              "target_20": 0,
              "target_40": 32385,
              "target_60": 63574,
          }

          actual = {
              c: int(df[c].isna().sum())
              for c in expected
          }

          if actual != expected:
              raise SystemExit(
                  f"Target NULL mismatch: {actual}"
              )

          print("DATASET VALIDATION PASSED")
          print("Rows:", len(df))
          print("Symbols:", df["symbol"].nunique())
          print("Columns:", len(df.columns))
          print("Target NULL:", actual)
          PY

      - name: Train H20 H40 H60
        env:
          OMP_NUM_THREADS: "2"
          OPENBLAS_NUM_THREADS: "2"
          MKL_NUM_THREADS: "2"
        run: |
          python scripts/train_walk_forward_causal.py \
            --input inputs/features_causal_586.pkl \
            --horizons 20 40 60 \
            --label-threshold 0.017 \
            --signal-threshold 0.60 \
            --folds 4 \
            --output-dir outputs/causal_walk_forward

          test -s outputs/causal_walk_forward/metrics_all_horizons.json

          for H in 20 40 60; do
            test -s "outputs/causal_walk_forward/H${H}/metrics.json"
            test -s "outputs/causal_walk_forward/H${H}/oof_predictions.pkl"
            test -d "outputs/causal_walk_forward/H${H}/models"
            test "$(find "outputs/causal_walk_forward/H${H}/models" -name 'xgb_fold_*.json' | wc -l)" -ge 1
          done

      - name: Publish models and reports
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="causal-training-586-${GITHUB_RUN_ID}"

          gh release create "$TAG" \
            outputs/causal_walk_forward/metrics_all_horizons.json \
            outputs/causal_walk_forward/H20/metrics.json \
            outputs/causal_walk_forward/H20/oof_predictions.pkl \
            outputs/causal_walk_forward/H20/models/*.json \
            outputs/causal_walk_forward/H40/metrics.json \
            outputs/causal_walk_forward/H40/oof_predictions.pkl \
            outputs/causal_walk_forward/H40/models/*.json \
            outputs/causal_walk_forward/H60/metrics.json \
            outputs/causal_walk_forward/H60/oof_predictions.pkl \
            outputs/causal_walk_forward/H60/models/*.json \
            --repo Javidshahadati/tse-engine \
            --target research/leakage-safe-pipeline-20261123 \
            --title "Causal 586 training ${GITHUB_RUN_ID}" \
            --notes "Research-only purged walk-forward training. H20/H40/H60. Four chronological folds. Not production-ready; point-in-time corporate-action safety remains unverified." \
            --prerelease

      - name: Completion
        run: echo "Training workflow completed."
